<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퍼블리싱 업무대장</title><style>
:root{--ink:#202124;--muted:#6f737b;--line:#dfe1e5;--soft:#f7f8fa;--pink:#ff2e98;--blue:#496fe5;--green:#18865b;--amber:#b66a00;--red:#d63d55;--weekend:#fff5f8}*{box-sizing:border-box}html{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--soft)}body{margin:0}button,input,select{font:inherit}.app-shell{min-height:100vh}.main{min-width:0}.topbar{height:78px;padding:0 30px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.title-box small{color:var(--pink);font-size:11px;font-weight:800;letter-spacing:.1em}.title-box h1{font-size:21px;margin:4px 0 0}.top-actions{display:flex;gap:8px}.button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:12px;cursor:pointer}.button.primary{background:var(--pink);border-color:var(--pink);color:#fff}.content{padding:22px 30px}.control-box{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.field{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 11px}.search{width:270px}.month-control{display:flex;align-items:center;gap:7px}.month-control strong{min-width:104px;text-align:center}.icon-button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.work-ledger-box{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.ledger-meta{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.ledger-meta strong{color:var(--ink)}.table-scroll{overflow:auto;max-height:calc(100vh - 210px)}table{border-collapse:separate;border-spacing:0;min-width:1780px;width:100%;font-size:12px}th,td{height:42px;padding:0 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;white-space:nowrap}thead th{position:sticky;top:0;z-index:5;background:#f1f3f6;font-weight:800;text-align:center}.month-head{height:34px!important;background:#282a31!important;color:#fff;font-size:13px}.col-no{width:46px;min-width:46px;text-align:center}.col-rms{width:76px;min-width:76px;text-align:center}.col-date{width:92px;min-width:92px;text-align:center}.col-task{width:400px;min-width:400px}.col-status{width:94px;min-width:94px;text-align:center}.fixed{position:sticky;z-index:3;background:#fff}.col-status.fixed{box-shadow:5px 0 8px #20212410}.day{width:42px;min-width:42px;padding:0;text-align:center}.day.weekend,.weekend{background:var(--weekend)}.day small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.task-name{max-width:382px;overflow:hidden;text-overflow:ellipsis}.rms-link{color:var(--blue);font-weight:700;text-decoration:none}.status-select{border:0;border-radius:999px;padding:5px 8px;font-weight:800;font-size:11px;outline:none}.status-완료{background:#e6f5ee;color:var(--green)}.status-진행{background:#eaf0ff;color:#3559bc}.status-검수{background:#fff2df;color:var(--amber)}.status-보류{background:#f1f1f4;color:#686b74}.status-예정{background:#f5eaff;color:#7b44a8}.hour-input{width:100%;height:32px;border:0;background:transparent;text-align:center;color:#34363b;outline:none}.hour-input:focus{box-shadow:inset 0 0 0 2px var(--pink);background:#fff}.total-cell{font-weight:800;background:#fafafa;text-align:center}.empty-box{display:none;padding:70px;text-align:center;color:var(--muted)}.footer-note{padding:12px 2px;color:var(--muted);font-size:11px}.dialog{border:0;border-radius:16px;padding:0;width:min(540px,calc(100% - 30px));box-shadow:0 24px 80px #0004}.dialog::backdrop{background:#1117}.dialog-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-head h2{font-size:18px;margin:0}.dialog-close{border:0;background:transparent;font-size:22px}.form-box{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field{display:grid;gap:6px;font-size:12px;font-weight:700}.form-field.full{grid-column:1/-1}.form-field input,.form-field select{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px}.dialog-actions{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}@media(max-width:900px){.content{padding:16px}.topbar{padding:0 18px}.control-box{display:block}.month-control{margin-top:12px}.table-scroll{max-height:calc(100vh - 260px)}}@media(max-width:600px){.topbar{height:auto;padding:15px}.top-actions .button:first-child{display:none}.content{padding:12px}.control-box{padding:12px}.filters{display:grid;grid-template-columns:1fr 1fr}.search{width:auto;grid-column:1/-1}.field{width:100%}.col-task{width:280px;min-width:280px}.col-no,.col-rms,.col-date,.col-status{position:static}.form-box{grid-template-columns:1fr}.form-field.full{grid-column:auto}}
</style><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><div class="main"><header class="topbar"><div class="title-box"><small>WORK LEDGER</small><h1>퍼블리싱 업무대장</h1></div><div class="top-actions"><a class="button" style="display:grid;place-items:center;text-decoration:none" href="https://docs.google.com/spreadsheets/d/1qrJOJKsQIhuCz0naAQQNnZsHF5md09fR0PuH_Dk0_SE/edit?usp=sharing" target="_blank" rel="noopener">원본 시트 ↗</a><button class="button primary" id="addButton">+ 업무 등록</button></div></header><main class="content"><div class="sync-banner" id="syncBanner">서버 데이터를 불러오는 중입니다.</div><section class="control-box"><div class="filters"><input class="field search" id="search" type="search" placeholder="RMS 또는 업무명 검색"><select class="field" id="statusFilter"><option value="">전체 진행현황</option><option>예정</option><option>대기</option><option>진행</option><option>검수</option><option>완료</option><option>보류</option></select><select class="field" id="categoryFilter"><option value="">전체 구분</option><option>공통</option><option>메인</option><option>플러스탭</option><option>닷컴개발요청SR</option></select></div><div class="month-control"><button class="icon-button" id="prevMonth">‹</button><strong id="monthLabel">9월</strong><button class="icon-button" id="nextMonth">›</button></div></section><section class="work-ledger-box"><div class="ledger-meta"><span><strong id="visibleCount">8개</strong> 업무 · 셀을 선택해 작업시간을 바로 입력하세요.</span><span>단위: 시간(h)</span></div><div class="table-scroll"><table><thead id="ledgerHead"></thead><tbody id="ledgerBody"></tbody></table><div class="empty-box" id="empty">검색 결과가 없습니다.</div></div></section><p class="footer-note">모든 변경 내용은 연결된 Google Sheet에 저장됩니다. 저장 완료 표시를 확인한 뒤 창을 닫아주세요.</p></main></div></div>
<dialog class="dialog" id="taskDialog"><form method="dialog" id="taskForm"><div class="dialog-head"><h2>새 업무 등록</h2><button class="dialog-close" value="cancel">×</button></div><div class="form-box"><label class="form-field"><span>RMS</span><input name="rms" inputmode="numeric" placeholder="예: 87036"></label><div class="form-field"><span>반영일</span><div class="date-entry"><input id="releaseDate" type="date"><button class="button" id="addDate" type="button">추가</button></div></div><div class="form-field full"><span>선택한 반영일</span><div class="date-chips" id="dateChips"></div></div><label class="form-field full"><span>업무명</span><input name="task" required placeholder="업무명을 입력하세요"></label><label class="form-field"><span>진행현황</span><select name="status"><option>예정</option><option>대기</option><option selected>진행</option><option>검수</option><option>완료</option><option>보류</option></select></label><label class="form-field"><span>구분</span><select name="category"><option>공통</option><option>메인</option><option>플러스탭</option><option>닷컴개발요청SR</option></select></label></div><div class="dialog-actions"><button class="button" value="cancel">취소</button><button class="button primary" value="default">등록</button></div></form></dialog>
<script src="config.js"></script><script src="app.js"></script></body></html>
