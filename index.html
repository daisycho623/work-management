rs{display:flex;gap:8px;flex-wrap:wrap}.field{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 11px}.search{width:270px}.month-control{display:flex;align-items:center;gap:7px}.month-control strong{min-width:104px;text-align:center}.icon-button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.work-ledger-box{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.ledger-meta{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.ledger-meta strong{color:var(--ink)}.table-scroll{overflow:auto;max-height:calc(100vh - 210px)}table{border-collapse:separate;border-spacing:0;min-width:1780px;width:100%;font-size:12px}th,td{height:42px;padding:0 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;white-space:nowrap}thead th{position:sticky;top:0;z-index:5;background:#f1f3f6;font-weight:800;text-align:center}.month-head{height:34px!important;background:#282a31!important;color:#fff;font-size:13px}.col-no{left:0;width:46px;min-width:46px;text-align:center}.col-rms{left:46px;width:76px;min-width:76px;text-align:center}.col-date{left:122px;width:92px;min-width:92px;text-align:center}.col-task{left:214px;width:400px;min-width:400px}.col-status{left:614px;width:94px;min-width:94px;text-align:center}.fixed{position:sticky;z-index:3;background:#fff}.col-status.fixed{box-shadow:5px 0 8px #20212410}.day{width:42px;min-width:42px;padding:0;text-align:center}.day.weekend,.weekend{background:var(--weekend)}.day small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.task-name{max-width:382px;overflow:hidden;text-overflow:ellipsis}.rms-link{color:var(--blue);font-weight:700;text-decoration:none}.status-select{border:0;border-radius:999px;padding:5px 8px;font-weight:800;font-size:11px;outline:none}.status-완료{background:#e6f5ee;color:var(--green)}.status-진행{background:#eaf0ff;color:#3559bc}.status-검수{background:#fff2df;color:var(--amber)}.status-보류{background:#f1f1f4;color:#686b74}.status-예정{background:#f5eaff;color:#7b44a8}.hour-input{width:100%;height:32px;border:0;background:transparent;text-align:center;color:#34363b;outline:none}.hour-input:focus{box-shadow:inset 0 0 0 2px var(--pink);background:#fff}.total-cell{font-weight:800;background:#fafafa;text-align:center}.empty-box{display:none;padding:70px;text-align:center;color:var(--muted)}.footer-note{padding:12px 2px;color:var(--muted);font-size:11px}.dialog{border:0;border-radius:16px;padding:0;width:min(540px,calc(100% - 30px));box-shadow:0 24px 80px #0004}.dialog::backdrop{background:#1117}.dialog-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-head h2{font-size:18px;margin:0}.dialog-close{border:0;background:transparent;font-size:22px}.form-box{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field{display:grid;gap:6px;font-size:12px;font-weight:700}.form-field.full{grid-column:1/-1}.form-field input,.form-field select{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px}.dialog-actions{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}@media(max-width:900px){.app-shell{grid-template-columns:74px 1fr}.sidebar{padding:22px 12px}.brand-copy,.nav-item span,.nav-title,.sidebar-foot{display:none}.brand-box{padding:0;justify-content:center}.nav-item{text-align:center}.content{padding:16px}.topbar{padding:0 18px}.control-box{display:block}.month-control{margin-top:12px}.table-scroll{max-height:calc(100vh - 260px)}}@media(max-width:600px){.app-shell{display:block}.sidebar{display:none}.topbar{height:auto;padding:15px}.top-actions .button:first-child{display:none}.content{padding:12px}.control-box{padding:12px}.filters{display:grid;grid-template-columns:1fr 1fr}.search{width:auto;grid-column:1/-1}.field{width:100%}.col-task{left:0;width:280px;min-width:280px}.col-no,.col-rms,.col-date,.col-status{position:static}.form-box{grid-template-columns:1fr}.form-field.full{grid-column:auto}}
</style></head><body><div class="app-shell"><aside class="sidebar"><div class="brand-box"><div class="brand-mark">W</div><div class="brand-copy"><strong>Work Management</strong><span>DX Design Team</span></div></div><nav class="nav"><button class="nav-item active">▤ <span>2026년 퍼블대장</span></button><div class="nav-title">MANAGEMENT</div><button class="nav-item">□ <span>휴가대장</span></button><button class="nav-item">◫ <span>구분 관리</span></button></nav><div class="sidebar-foot">Google Sheet compatible · v1.0</div></aside><div class="main"><header class="topbar"><div class="title-box"><small>WORK LEDGER</small><h1>2026년 퍼블리싱 업무대장</h1></div><div class="top-actions"><a class="button" style="display:grid;place-items:center;text-decoration:none" href="https://docs.google.com/spreadsheets/d/1qrJOJKsQIhuCz0naAQQNnZsHF5md09fR0PuH_Dk0_SE/edit?usp=sharing" target="_blank" rel="noopener">원본 시트 ↗</a><button class="button primary" id="addButton">+ 업무 등록</button></div></header><main class="content"><section class="control-box"><div class="filters"><input class="field search" id="search" type="search" placeholder="RMS 또는 업무명 검색"><select class="field" id="statusFilter"><option value="">전체 진행현황</option><option>예정</option><option>진행</option><option>검수</option><option>완료</option><option>보류</option></select><select class="field" id="categoryFilter"><option value="">전체 구분</option><option>공통</option><option>메인</option><option>플러스탭</option><option>닷컴개발요청SR</option></select></div><div class="month-control"><button class="icon-button" id="prevMonth">‹</button><strong id="monthLabel">2026년 9월</strong><button class="icon-button" id="nextMonth">›</button></div></section><section class="work-ledger-box"><div class="ledger-meta"><span><strong id="visibleCount">8개</strong> 업무 · 셀을 선택해 작업시간을 바로 입력하세요.</span><span>단위: 시간(h)</span></div><div class="table-scroll"><table><thead id="ledgerHead"></thead><tbody id="ledgerBody"></tbody></table><div class="empty-box" id="empty">검색 결과가 없습니다.</div></div></section><p class="footer-note">변경 내용은 이 브라우저에 임시 저장됩니다. Google Sheet 실시간 저장 연결은 Apps Script API 연동 시 활성화할 수 있습니다.</p></main></div></div>
<dialog class="dialog" id="taskDialog"><form method="dialog" id="taskForm"><div class="dialog-head"><h2>새 업무 등록</h2><button class="dialog-close" value="cancel">×</button></div><div class="form-box"><label class="form-field"><span>RMS</span><input name="rms" inputmode="numeric" placeholder="예: 87036"></label><label class="form-field"><span>반영일</span><input name="date" type="date" required></label><label class="form-field full"><span>업무명</span><input name="task" required placeholder="업무명을 입력하세요"></label><label class="form-field"><span>진행현황</span><select name="status"><option>예정</option><option selected>진행</option><option>검수</option><option>완료</option><option>보류</option></select></label><label class="form-field"><span>구분</span><select name="category"><option>공통</option><option>메인</option><option>플러스탭</option><option>닷컴개발요청SR</option></select></label></div><div class="dialog-actions"><button class="button" value="cancel">취소</button><button class="button primary" value="default">등록</button></div></form></dialog>
<script>
const seed=[
{id:1,rms:'87036',date:'2026-09-15',task:'[DCBGIT-44424] [개인화] 추천 영역 UI 개선 및 운영 반영',status:'완료',category:'플러스탭',hours:{2:1,3:2,4:1.5,7:2,8:3,14:.75}},
{id:2,rms:'86944',date:'2026-09-11',task:'[메인][플러스탭] 9월 콘텐츠 썸네일 및 상세 페이지 교체',status:'완료',category:'메인',hours:{1:2,2:3,9:1,10:2}},
{id:3,rms:'87081',date:'2026-09-18',task:'[DCBGIT-44510] 고객지원 페이지 접근성 개선 요청',status:'진행',category:'공통',hours:{8:1,9:2,10:3,11:2,14:3}},
{id:4,rms:'87103',date:'2026-09-22',task:'[닷컴개발요청SR] 모바일 요금제 랜딩 수정 및 QA',status:'검수',category:'닷컴개발요청SR',hours:{14:2,15:3,16:3,17:1}},
{id:5,rms:'',date:'2026-09-25',task:'[플러스탭] Simple. Lab 9월 월간 리포트 제작',status:'진행',category:'플러스탭',hours:{17:2,18:4,21:3}},

{id:7,rms:'86872',date:'2026-09-04',task:'[메인] 프로모션 KV 배너 반응형 오류 수정',status:'완료',category:'메인',hours:{1:1,2:2,3:2}},
{id:8,rms:'87098',date:'2026-09-24',task:'[플러스탭] 생일 파티 이벤트 종료 콘텐츠 교체',status:'보류',category:'플러스탭',hours:{11:1,14:2}}
];let current=new Date(2026,8,1);let tasks=JSON.parse(localStorage.getItem('work-ledger-tasks')||'null')||seed;const $=s=>document.querySelector(s);function daysInMonth(){return new Date(current.getFullYear(),current.getMonth()+1,0).getDate()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const y=current.getFullYear(),m=current.getMonth(),days=daysInMonth();$('#monthLabel').textContent=`${y}년 ${m+1}월`;let dayHeads='';for(let d=1;d<=days;d++){const dow=new Date(y,m,d).getDay(),w=['일','월','화','수','목','금','토'][dow];dayHeads+=`<th class="day ${dow===0||dow===6?'weekend':''}">${d}<small>${w}</small></th>`}$('#ledgerHead').innerHTML=`<tr><th class="month-head" colspan="5">업무 정보</th><th class="month-head" colspan="${days}">${y}년 ${m+1}월 일별 작업시간</th><th class="month-head">합계</th></tr><tr><th class="fixed col-no">NO</th><th class="fixed col-rms">RMS</th><th class="fixed col-date">반영일</th><th class="fixed col-task">업무명</th><th class="fixed col-status">진행현황</th>${dayHeads}<th>합계</th></tr>`;const q=$('#search').value.toLowerCase(),status=$('#statusFilter').value,cat=$('#categoryFilter').value;const filtered=tasks.filter(t=>(!q||`${t.rms} ${t.task}`.toLowerCase().includes(q))&&(!status||t.status===status)&&(!cat||t.category===cat));$('#visibleCount').textContent=`${filtered.length}개`;$('#empty').style.display=filtered.length?'none':'block';$('#ledgerBody').innerHTML=filtered.map((t,i)=>{let cells='',total=0;for(let d=1;d<=days;d++){const val=t.hours[d]??'',dow=new Date(y,m,d).getDay();total+=Number(val)||0;cells+=`<td class="day ${dow===0||dow===6?'weekend':''}"><input class="hour-input" inputmode="decimal" value="${val}" data-id="${t.id}" data-day="${d}" aria-label="${d}일 작업시간"></td>`}return `<tr><td class="fixed col-no">${i+1}</td><td class="fixed col-rms">${t.rms?`<a class="rms-link" href="http://210.108.138.187/redmine/issues/${esc(t.rms)}" target="_blank">${esc(t.rms)}</a>`:'-'}</td><td class="fixed col-date">${esc(t.date.slice(5).replace('-','/'))}</td><td class="fixed col-task"><div class="task-name" title="${esc(t.task)}">${esc(t.task)}</div></td><td class="fixed col-status"><select class="status-select status-${t.status}" data-status="${t.id}">${['예정','진행','검수','완료','보류'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></td>${cells}<td class="total-cell">${total||'-'}</td></tr>`}).join('')};function save(){localStorage.setItem('work-ledger-tasks',JSON.stringify(tasks))}$('#prevMonth').onclick=()=>{current.setMonth(current.getMonth()-1);render()};$('#nextMonth').onclick=()=>{current.setMonth(current.getMonth()+1);render()};['search','statusFilter','categoryFilter'].forEach(id=>$('#'+id).addEventListener('input',render));$('#ledgerBody').addEventListener('change',e=>{const hour=e.target.closest('.hour-input'),status=e.target.closest('[data-status]');if(hour){const t=tasks.find(x=>x.id==hour.dataset.id),v=hour.value.trim();if(v==='')delete t.hours[hour.dataset.day];else t.hours[hour.dataset.day]=Math.max(0,Number(v)||0)}if(status){const t=tasks.find(x=>x.id==status.dataset.status);t.status=status.value}save();render()});$('#addButton').onclick=()=>$('#taskDialog').showModal();$('#taskForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);tasks.push({id:Date.now(),rms:f.get('rms'),date:f.get('date'),task:f.get('task'),status:f.get('status'),category:f.get('category'),hours:{}});save();e.target.reset();$('#taskDialog').close();render()});render();
</script></body></html>
