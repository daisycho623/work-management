<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>퍼블리싱 업무대장</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-shell">
    <div class="main">
      <header class="topbar">
        <div class="title-box">
          <small>WORK LEDGER</small>
          <h1>퍼블리싱 업무대장</h1>
        </div>
        <div class="top-actions">
          <a href="https://docs.google.com/spreadsheets/d/1qrJOJKsQIhuCz0naAQQNnZsHF5md09fR0PuH_Dk0_SE/edit?usp=sharing"
            rel="noopener" class="button" target="_blank" style="display:grid;place-items:center;text-decoration:none">
            원본 시트 ↗
          </a>
          <button class="button primary" id="addButton">+ 업무 등록</button>
        </div>
      </header>
      <main class="content">
        <div class="sync-banner" id="syncBanner">서버 데이터를 불러오는 중입니다.</div>
        <section class="control-box">
          <div class="filters">
            <select class="field" id="categoryFilter">
              <option value="">전체 구분</option>
              <option>플러스탭</option>
              <option>전사 운영</option>
            </select>
            <select class="field" id="statusFilter">
              <option value="">전체 진행현황</option>
              <option>예정</option>
              <option>보류</option>
              <option>진행</option>
              <option>검수</option>
              <option>대기</option>
              <option>완료</option>
            </select>
            <input class="field search" id="search" type="search" placeholder="RMS 또는 업무명 검색">
          </div>
          <div class="month-control">
            <button class="icon-button" id="prevMonth">‹</button>
            <strong id="monthLabel">9월</strong>
            <button class="icon-button" id="nextMonth">›</button>
          </div>
        </section>
        <section class="work-ledger-box">
          <div class="ledger-meta">
            <span><strong id="visibleCount">0개</strong> 업무 · 셀을 선택해 작업시간을 바로 입력하세요.</span>
            <span>단위: 시간(h)</span>
          </div>
          <div class="table-scroll">
            <table>
              <thead id="ledgerHead"></thead>
              <tbody id="ledgerBody"></tbody>
            </table>
            <div class="empty-box" id="empty">검색 결과가 없습니다.</div>
          </div>
        </section>
        <p class="footer-note">모든 변경 내용은 연결된 Google Sheet에 저장됩니다. 저장 완료 표시를 확인한 뒤 창을 닫아주세요.</p>
      </main>
    </div>
  </div>
  <dialog class="dialog" id="taskDialog">
    <form method="dialog" id="taskForm">
      <div class="dialog-head">
        <h2>새 업무 등록</h2>
        <button class="dialog-close" type="button" data-dialog-close aria-label="닫기">×</button>
      </div>
      <div class="form-box">
        <label class="form-field">
          <span>RMS</span><input name="rms" inputmode="numeric" placeholder="예: 87036">
        </label>
        <div class="form-field">
          <span>반영일</span>
          <div class="date-entry">
            <input id="releaseDate" type="date">
            <button class="button" id="addDate" type="button">추가</button>
          </div>
        </div>
        <div class="form-field full">
          <span>선택한 반영일</span>
          <div class="date-chips" id="dateChips"></div>
        </div>
        <label class="form-field full">
          <span>업무명</span>
          <input name="task" required placeholder="업무명을 입력하세요">
        </label>
        <label class="form-field">
          <span>진행현황</span>
          <select name="status">
            <option selected>예정</option>
            <option>보류</option>
            <option>진행</option>
            <option>검수</option>
            <option>대기</option>
            <option>완료</option>
          </select>
        </label>
        <label class="form-field">
          <span>구분</span>
          <select name="category">
            <option>전사 운영</option>
            <option selected>플러스탭</option>
          </select>
        </label>
      </div>
      <div class="dialog-actions">
        <button class="button" type="button" data-dialog-close>취소</button>
        <button class="button primary" value="default">등록</button>
      </div>
    </form>
  </dialog>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
